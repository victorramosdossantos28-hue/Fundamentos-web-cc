<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulario HTML</title>
</head>
<body>
    <head>
        <h3>Formulario e Inputs</h3>
    </head>
    <main>
        <form id="registerForm" method="POST">
            <label> Nome Completo: </label>
            <input type="text" id="nome" name="nome" required />
            <br>
            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email"/>
            <br>
            <label for="senha">Digite sua senha: </label>
            <input type="password" id="senha" name="senha" required minlength="8" title="A senha deve ter no minimo 8 caracteres"/>
            <br>
            <label for="mensagem">Informe sua mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <br>
            <label for="evento">Selecione o evento escolhido: </label>
            <select id="evento" name="evento">
                <option value="rock">Show de Rock</option>
                <option value="Sertanejo">Show de Sertanejo</option>
                <option value="teatro">Teatro: Comédia</option>
            </select>
            <br>
            <!-- Input checkbox -> Opção de multpla escolha:  -->
            <br>
            <label for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
            </label>
            <br>
            <br>
            <!-- Input type radio - Escolha única -->
            <label><input type="radio" name="pagamento" value="pix"/>Pix</label>
            <label><input type="radio" name="pagamento" value="cartao"/>Cartão</label>
            <br>
            <br>
            <input type="date"/>
            <br>
            <br>
            <input type="file">
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00"/>
            <br>
            <br>
            <input type="submit" value="Cadastrar"/>
            <button type="button" onclick="">Cancelar</button>
        </form>

    </main>
    <footer>
        <p>Desenvolvido por Víctor</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event)
        {
            event.preventDefault; // impede o comportamento padrão de envio do formulario (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Olá, '+ nome+ ' cadastro enviado com sucesso!');
        })
    </script>
    
</body>
</html>
